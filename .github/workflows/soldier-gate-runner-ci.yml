name: Soldier Gate Runner CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/soldier-gate-runner-by-claude/**'
      - '.github/workflows/soldier-gate-runner-ci.yml'
  pull_request:
    paths:
      - 'projects/soldier-gate-runner-by-claude/**'
      - '.github/workflows/soldier-gate-runner-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/soldier-gate-runner-by-claude
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Game logic tests
        run: node --test tests/game-logic.test.js

      - name: Static site tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Headless browser smoke test
        run: python tests/browser_smoke.py
