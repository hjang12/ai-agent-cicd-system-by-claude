<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Soldier Gate Runner</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101820; color: #e8f1f8; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #stage { position: relative; width: min(92vw, 420px, calc((100vh - 150px) * 9 / 16)); }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; background: #7ec8ff; touch-action: none; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: rgba(8,16,28,0.7); border-radius: 8px; }
    #overlay[hidden] { display: none; }
    #overlay h2 { margin: 0; font-size: 1.6rem; } #overlay p { font-size: 0.95rem; opacity: 0.9; }
    #layout { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #speedbar { display: flex; gap: 8px; }
    #speedbar button { min-width: 52px; padding: 8px 12px; border: 2px solid #2f6fd0; border-radius: 10px; background: transparent; color: #cfe2ff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    #speedbar button[aria-pressed="true"] { background: #2f6fd0; color: #fff; }
    @media (min-width: 720px) { #layout { flex-direction: row; align-items: flex-start; } #speedbar { flex-direction: column; } }
    #ov-btn { font-size: 1.1rem; padding: 10px 28px; border: 0; border-radius: 8px; background: #2f6fd0; color: #fff; cursor: pointer; }
    h1 { margin: 0; font-size: 1.25rem; }
    p { margin: 0; font-size: 0.85rem; opacity: 0.75; }
    @media (orientation: landscape) and (max-height: 600px) {
      body { box-sizing: border-box; padding: 8px; gap: 0; }
      h1, #status { display: none; }
      #layout { flex-direction: row; align-items: center; gap: 10px; }
      #stage { width: auto; }
      canvas { width: auto; height: calc(100vh - 16px); aspect-ratio: auto; }
      #speedbar { flex-direction: column; gap: 6px; }
      #speedbar button { min-width: 48px; padding: 6px 8px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <h1 id="title">Soldier Gate Runner</h1>
  <div id="layout"><div id="stage"><canvas id="game" width="360" height="640" aria-label="게임 화면"></canvas>
    <div id="overlay"><h2 id="ov-title"></h2><p id="ov-sub"></p><button id="ov-btn" type="button">시작</button></div></div>
    <div id="speedbar" role="group" aria-label="게임 속도"><button type="button" data-speed="1">x1</button><button type="button" data-speed="2">x2</button><button type="button" data-speed="3">x3</button><button type="button" data-speed="4">x4</button></div></div>
  <p id="status" data-version="0.7.0-m3">M3 — 전투 연출, 레인, 배속 x1~x4</p>
  <script src="src/game-logic.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
